name: Deploy iTrace on Tag

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Preflight SSH connectivity
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          echo "Testing SSH TCP connectivity..."
          if ! nc -vz -w 10 "$SSH_HOST" "$SSH_PORT"; then
            echo "Unable to reach $SSH_HOST:$SSH_PORT from this GitHub runner."
            echo "Check firewall/security-group allowlists and SSH daemon bind/port settings."
            exit 1
          fi

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script_stop: true
          timeout: 120s
          command_timeout: 60m
          debug: true
          envs: VERSION,MSSQL_SA_PASSWORD,APP_NAME,DEPLOY_APP_PATH
          script: |
            set -euo pipefail

            echo "=== Deploying ${APP_NAME} ${VERSION} ==="

            if [ "$(whoami)" != "github-actions" ]; then
              echo "DEPLOY_SSH_USER must be github-actions."
              exit 1
            fi

            if [ -z "$APP_NAME" ] || [ -z "$DEPLOY_APP_PATH" ]; then
              echo "DEPLOY_APP_NAME and DEPLOY_APP_PATH are required."
              exit 1
            fi

            path_prefix="/home/github-actions/sites/"
            if [ "${DEPLOY_APP_PATH#"$path_prefix"}" = "$DEPLOY_APP_PATH" ]; then
              echo "DEPLOY_APP_PATH must be under /home/github-actions/sites/."
              exit 1
            fi

            if ! printf '%s' "$APP_NAME" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "DEPLOY_APP_NAME may only contain letters, numbers, dot, underscore, and dash."
              exit 1
            fi

            mkdir -p "$DEPLOY_APP_PATH"
            cd "$DEPLOY_APP_PATH"

            if [ ! -d ".git" ]; then
              rm -rf .docker .env
              if [ -n "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "DEPLOY_APP_PATH exists but is not a git checkout: $DEPLOY_APP_PATH"
                echo "Move or clean this directory, then rerun the deployment."
                ls -la
                exit 1
              fi
              git clone "git@github.com-${APP_NAME}:${{ github.repository }}.git" .
            fi

            export HOME="/home/github-actions"
            export DOCKER_CONFIG="$DEPLOY_APP_PATH/.docker"
            mkdir -p "$DOCKER_CONFIG"
            chmod 700 "$DOCKER_CONFIG"

            git fetch --all --tags --prune

            if ! git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
              echo "Tag ${VERSION} was not found in repository"
              exit 1
            fi

            git checkout "tags/${VERSION}" -f

            : > .env
            printf "%s='%s'\n" ASPNETCORE_ENVIRONMENT Production >> .env
            printf "%s='%s'\n" WEB_PORT 8082 >> .env
            printf "%s='%s'\n" IMAGE_TAG "${VERSION}" >> .env
            printf "%s='%s'\n" MSSQL_SA_PASSWORD "${MSSQL_SA_PASSWORD}" >> .env
            chmod 600 .env

            bash scripts/deploy.sh

            echo "=== Deployment of ${APP_NAME} ${VERSION} complete ==="
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          APP_NAME: ${{ secrets.DEPLOY_APP_NAME }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
