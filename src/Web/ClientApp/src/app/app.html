<i-layout [config]="layoutConfig" [menuModel]="menuModel()">
  <div topbarActions class="topbar-actions">
    <i-select
      class="application-selector"
      label="Application"
      placeholder="Application"
      [useFloatLabel]="false"
      [options]="applicationContext.applicationOptions()"
      optionLabel="label"
      [showClear]="true"
      [fluid]="true"
      [ngModel]="applicationContext.selectedApplication()"
      (ngModelChange)="applicationContext.selectApplication($event)"
    />
    <i-tag value="Collector" severity="success" icon="pi pi-circle-fill" [rounded]="true" />
    <i-button
      icon="pi pi-sign-out"
      severity="contrast"
      size="medium"
      [text]="true"
      ariaLabel="Sign out"
      iTooltip="Sign out"
      tooltipPosition="below"
      (clicked)="auth.logoff().subscribe()"
    />
  </div>
</i-layout>
