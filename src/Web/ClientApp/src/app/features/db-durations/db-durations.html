<section class="page-shell">
  <header class="page-header">
    <div>
      <p class="eyebrow">Database</p>
      <h1>DB durations</h1>
    </div>
    <div class="page-actions">
      <i-select
        label="Time range"
        [options]="timeRangeOptions"
        optionLabel="label"
        [fluid]="true"
        [(ngModel)]="selectedTimeRange"
        (ngModelChange)="selectTimeRange($event)"
      />
      <i-button icon="pi pi-refresh" severity="secondary" iTooltip="Refresh" (clicked)="load()" />
    </div>
  </header>

  <i-card title="Database operation volume">
    @if (filteredEvents().length > 0) {
      <i-chart [charts]="chart()" height="20rem" />
    } @else {
      <p class="empty-state">No database operations in this time range</p>
    }
  </i-card>

  <i-card title="Database timings by group">
    <i-table
      [grid]="groupGrid()"
      [sortable]="true"
      [globalFilter]="true"
      [striped]="true"
      dataKey="groupKey"
      height="42rem"
    />
  </i-card>
</section>
