<i-page-layout headerText="Error log" eyebrowText="Errors">
  <div iPageHeaderActions class="page-actions">
    <i-select
      label="Time range"
      [options]="timeRangeOptions"
      optionLabel="label"
      [fluid]="true"
      [(ngModel)]="selectedTimeRange"
      (ngModelChange)="selectTimeRange($event)"
    />
    <i-button icon="pi pi-refresh" severity="secondary" iTooltip="Refresh" (clicked)="load()" />
  </div>
  <div class="page-sections">
    <div class="trace-lookup">
      <i-input-text
        label="Trace ID"
        placeholder="Enter a trace ID"
        [fluid]="true"
        [(ngModel)]="traceIdLookup"
        (keydown.enter)="lookupTraceId()"
      />
      <i-button
        icon="pi pi-search"
        [loading]="traceLookupLoading()"
        [disabled]="traceLookupLoading()"
        (clicked)="lookupTraceId()"
        size="large"
        >Look up</i-button
      >
    </div>
    @if (filteredEvents().length > 0) {
      <i-card title="Error volume">
        <i-chart [charts]="chart()" height="20rem" />
      </i-card>
    }

    <i-table
      [showBorder]="true"
      [grid]="eventGrid()"
      [loading]="loading()"
      [emptyMessage]="loadError() ? 'Unable to load errors' : 'No errors in this time range'"
      [sortable]="true"
      [globalFilter]="true"
      [striped]="true"
      dataKey="groupKey"
      height="42rem"
    />
  </div>
</i-page-layout>
